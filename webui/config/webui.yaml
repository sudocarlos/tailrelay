server:
  port: 8021
  host: "0.0.0.0"

auth:
  token_file: "/var/lib/tailscale/.webui_token"

paths:
  serve_relay_config: "/var/lib/tailscale/serve_relays.json"
  state_dir: "/var/lib/tailscale"
  backup_dir: "/var/lib/tailscale/backups"
  certificates_dir: "/data"

backup:
  auto_backup_enabled: false
  auto_backup_schedule: "0 2 * * *"
  retention_count: 10

logging:
  level: "info"
  format: "text"

tailscale:
  # Custom control server URL (e.g. a self-hosted Headscale instance).
  # Leave empty to use Tailscale's default control plane. Managed via the
  # Control Server field on the Tailscale page, or GET/POST
  # /api/tailscale/control-server(-/update).
  control_server: ""
