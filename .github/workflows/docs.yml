name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - 'docs/openapi.yaml'
      - 'docs/screenshots/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      # The capture script mirrors docs/screenshots/ into the site's docs dir,
      # but only the mirrored copy is published. Fail loudly on drift rather
      # than deploying stale images that look fine.
      - name: Verify screenshots are mirrored
        working-directory: ${{ github.workspace }}
        run: diff -rq --exclude='*.mjs' --exclude='node_modules' docs/screenshots website/docs/img/screenshots

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build
        run: mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
