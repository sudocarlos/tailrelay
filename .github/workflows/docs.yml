name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - 'docs/openapi.yaml'
      - 'docs/screenshots/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      # The capture script mirrors docs/screenshots/ into the site's static dir,
      # but only the mirrored copy is published. Fail loudly on drift rather
      # than deploying stale images that look fine.
      - name: Verify screenshots are mirrored
        working-directory: ${{ github.workspace }}
        run: diff -rq --exclude='*.mjs' --exclude='node_modules' docs/screenshots website/static/img/screenshots

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Clean API docs
        run: npm run docusaurus clean-api-docs all

      - name: Generate API docs
        run: npm run docusaurus gen-api-docs all

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
