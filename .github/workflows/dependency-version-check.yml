name: Dependency Version Check

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect new Go version
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            const fs = require('fs');

            function get(url) {
              return new Promise((resolve, reject) => {
                https.get(url, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve(data));
                }).on('error', reject);
              });
            }

            const dockerfile = fs.readFileSync('Dockerfile', 'utf8');
            const match = dockerfile.match(/ARG GO_VERSION=([\d.]+)/);
            if (!match) { core.setFailed('Could not find GO_VERSION in Dockerfile'); return; }
            const pinned = match[1];
            core.info(`Pinned Go version: ${pinned}`);

            const raw = await get('https://go.dev/VERSION?m=text');
            const latest = raw.split('\n')[0].replace(/^go/, '');
            core.info(`Latest Go version: ${latest}`);

            if (pinned === latest) {
              core.info('Go is up to date.');
              core.setOutput('skip', 'true');
              return;
            }

            // Skip if an open bump PR already exists for this version
            const branch = `chore/bump-go-${latest}`;
            const { data: openPrs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (openPrs.length > 0) {
              core.info(`Bump PR already exists for ${latest}: #${openPrs[0].number}`);
              core.setOutput('skip', 'true');
              return;
            }

            // Ensure a labeled tracking issue exists for this version pair
            const title = `chore: update Go from ${pinned} to ${latest}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'dependencies',
              per_page: 100,
            });
            let issueNumber = existing.find(i => i.title === title)?.number;
            if (!issueNumber) {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The Dockerfile uses Go \`${pinned}\` but the latest stable release is \`${latest}\`.`,
                labels: ['dependencies'],
                assignees: ['sudocarlos'],
              });
              issueNumber = issue.number;
              core.info(`Created tracking issue #${issueNumber}: ${issue.html_url}`);
            } else {
              core.info(`Reusing tracking issue #${issueNumber}`);
            }

            core.setOutput('skip', 'false');
            core.setOutput('pinned', pinned);
            core.setOutput('latest', latest);
            core.setOutput('issue_number', issueNumber);

      - name: Apply version bump
        if: steps.detect.outputs.skip != 'true'
        env:
          PINNED: ${{ steps.detect.outputs.pinned }}
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="chore/bump-go-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          sed -i "s/ARG GO_VERSION=${PINNED}/ARG GO_VERSION=${LATEST}/" Dockerfile
          sed -i "s/^go ${PINNED}$/go ${LATEST}/" webui/go.mod
          sed -i "s/go-version: '${PINNED}'/go-version: '${LATEST}'/g" .github/workflows/ci.yml
          for f in .agents/skills/docker-ci/SKILL.md .agents/skills/security-review/SKILL.md .agents/skills/testing-cicd/SKILL.md; do
            sed -i "s/${PINNED}/${LATEST}/g" "$f"
          done
          awk -v line="- **Go** bumped from \`${PINNED}\` to \`${LATEST}\` in Dockerfile, \`go.mod\`, and CI" '
            /^## \[Unreleased\]/ { unreleased = 1 }
            unreleased && /^### Changed/ && !done { print; print line; done = 1; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          git add Dockerfile webui/go.mod .github/workflows/ci.yml .agents/skills CHANGELOG.md
          git commit -m "chore: update Go from ${PINNED} to ${LATEST}" -m "$(printf '%s\n' \
            "- bump GO_VERSION to ${LATEST} in Dockerfile, go.mod, and ci.yml" \
            "- update docker-ci, security-review, and testing-cicd skill docs to match" \
            "- add CHANGELOG entry under [Unreleased]")"
          git push --force origin "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_ENV"

      - name: Create bump PR
        if: steps.detect.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pinned = '${{ steps.detect.outputs.pinned }}';
            const latest = '${{ steps.detect.outputs.latest }}';
            const issueNumber = '${{ steps.detect.outputs.issue_number }}';
            const branch = process.env.branch || `chore/bump-go-${latest}`;

            const body = [
              `A new stable release of **Go** has been published.`,
              ``,
              `| Field | Value |`,
              `|-------|-------|`,
              `| Pinned | \`${pinned}\` |`,
              `| Latest stable | \`${latest}\` |`,
              `| Source | \`Dockerfile:GO_VERSION\` |`,
              ``,
              `### Links`,
              ``,
              `- [Go ${latest} release notes](https://go.dev/doc/devel/release#go${latest})`,
              `- [Go downloads](https://go.dev/dl/)`,
              ``,
              `### Changes in this PR`,
              ``,
              `- Bump \`GO_VERSION\` to \`${latest}\` in Dockerfile, \`webui/go.mod\`, and all \`ci.yml\` jobs`,
              `- Update docker-ci, security-review, and testing-cicd skill docs to match`,
              `- Add CHANGELOG entry under \`[Unreleased]\` → \`### Changed\``,
              ``,
              `> **Note:** This PR was created automatically by the dependency version check workflow.`,
              `> Verify the build before merging.`,
              ``,
              `Closes #${issueNumber}`,
            ].join('\n');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: update Go from ${pinned} to ${latest}`,
              head: branch,
              base: context.repo.default_branch,
              body: body.join('\n'),
              assignees: ['sudocarlos'],
            });
            core.info(`Created PR #${pr.number}: ${pr.html_url}`);

            // GITHUB_TOKEN pushes do not trigger workflow runs; close + reopen
            // the PR to fire the pull_request (reopened) event and start CI.
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'open',
            });
            core.info('Reopened PR to trigger CI.');

  tailscale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check Tailscale version and open issue if outdated
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            const fs = require('fs');

            function get(url, headers = {}) {
              return new Promise((resolve, reject) => {
                https.get(url, { headers }, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve({ status: res.statusCode, headers: res.headers, body: data }));
                }).on('error', reject);
              });
            }

            function head(url, headers = {}) {
              return new Promise((resolve, reject) => {
                const opts = { method: 'HEAD', headers, ...require('url').parse(url) };
                https.request(opts, (res) => {
                  res.resume();
                  resolve({ status: res.statusCode, headers: res.headers });
                }).on('error', reject).end();
              });
            }

            // 1. Read pinned version from Dockerfile
            const dockerfile = fs.readFileSync('Dockerfile', 'utf8');
            const match = dockerfile.match(/ARG TAILSCALE_VERSION=(v[\d.]+)/);
            if (!match) { core.setFailed('Could not find TAILSCALE_VERSION in Dockerfile'); return; }
            const pinnedVersion = match[1];
            core.info(`Pinned version: ${pinnedVersion}`);

            // 2. Obtain anonymous GHCR token
            const tokenRes = await get(
              'https://ghcr.io/token?scope=repository:tailscale/tailscale:pull&service=ghcr.io'
            );
            const { token } = JSON.parse(tokenRes.body);
            const authHeader = `Bearer ${token}`;
            const manifestAccept = [
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
            ].join(',');

            // 3. Get digest of the current "stable" tag
            const stableHead = await head(
              'https://ghcr.io/v2/tailscale/tailscale/manifests/stable',
              { Authorization: authHeader, Accept: manifestAccept }
            );
            const stableDigest = stableHead.headers['docker-content-digest'];
            if (!stableDigest) { core.setFailed('Could not retrieve digest for tailscale:stable'); return; }
            core.info(`stable digest: ${stableDigest}`);

            // 4. Fetch full tag list (paginated) and find versioned tag matching stable digest
            let allTags = [];
            let tagsUrl = 'https://ghcr.io/v2/tailscale/tailscale/tags/list';
            while (tagsUrl) {
              const tagsRes = await get(tagsUrl, { Authorization: authHeader });
              const { tags } = JSON.parse(tagsRes.body);
              allTags = allTags.concat(tags);
              const link = tagsRes.headers['link'];
              if (link) {
                const m = link.match(/<([^>]+)>;\s*rel="next"/);
                tagsUrl = m ? (m[1].startsWith('http') ? m[1] : `https://ghcr.io${m[1]}`) : null;
              } else {
                tagsUrl = null;
              }
            }
            const versionTags = allTags
              .filter(t => /^v\d+\.\d+\.\d+$/.test(t))
              .sort((a, b) => {
                const pa = a.slice(1).split('.').map(Number);
                const pb = b.slice(1).split('.').map(Number);
                for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
                return 0;
              });
            core.info(`Checking ${versionTags.length} versioned tags from ${versionTags[0]}…`);

            let stableVersion = null;
            for (const tag of versionTags) {
              const res = await head(
                `https://ghcr.io/v2/tailscale/tailscale/manifests/${tag}`,
                { Authorization: authHeader, Accept: manifestAccept }
              );
              if (res.headers['docker-content-digest'] === stableDigest) {
                stableVersion = tag;
                break;
              }
            }
            if (!stableVersion) { core.setFailed('Could not match stable digest to any versioned tag'); return; }
            core.info(`stable version resolved to: ${stableVersion}`);

            if (pinnedVersion === stableVersion) { core.info('Dockerfile is up to date.'); return; }

            // 5. Check if an issue already exists (open or closed) for this version pair
            const issueTitle = `chore: update Tailscale from ${pinnedVersion} to ${stableVersion}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            if (existing.some(i => i.title === issueTitle)) {
              core.info(`Issue already exists for ${stableVersion}, nothing to do.`);
              return;
            }

            // 6. Create the issue
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: [
                `The Dockerfile pins \`ghcr.io/tailscale/tailscale:${pinnedVersion}\` but the current stable release is \`${stableVersion}\`.`,
                ``,
                `| Field | Value |`,
                `|-------|-------|`,
                `| Pinned | \`${pinnedVersion}\` |`,
                `| Latest stable | \`${stableVersion}\` |`,
                `| Digest | \`${stableDigest}\` |`,
                ``,
                `### Links`,
                `- [GHCR package](https://github.com/tailscale/tailscale/pkgs/container/tailscale)`,
                `- [GitHub Release](https://github.com/tailscale/tailscale/releases/tag/${stableVersion})`,
                `- [Changelog](https://tailscale.com/changelog)`,
              ].join('\n'),
              assignees: ['sudocarlos'],
            });
            core.info(`Created issue #${issue.number}: ${issue.html_url}`);

  node:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect outdated Node version
        uses: actions/github-script@v7
        id: detect
        with:
          script: |
            const https = require('https');
            const fs = require('fs');

            function get(url) {
              return new Promise((resolve, reject) => {
                https.get(url, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve({ status: res.statusCode, body: data }));
                }).on('error', reject);
              });
            }

            const dockerfile = fs.readFileSync('Dockerfile', 'utf8');
            const match = dockerfile.match(/ARG NODE_VERSION=([\d.]+)/);
            if (!match) { core.setFailed('Could not find NODE_VERSION in Dockerfile'); return; }
            const pinned = match[1];
            core.info(`Pinned Node version: ${pinned}`);

            const major = pinned.split('.')[0];
            const listing = await get(`https://nodejs.org/download/release/latest-v${major}.x/`);
            const vMatch = listing.body.match(new RegExp(`node-v(${major}\\.\\d+\\.\\d+)-`));
            if (!vMatch) { core.setFailed('Could not parse Node version from release listing'); return; }
            const latest = vMatch[1];
            core.info(`Latest Node version: ${latest}`);

            if (pinned === latest) {
              core.info('Node is up to date.');
              core.setOutput('skip', 'true');
              return;
            }

            const title = `chore: update Node from ${pinned} to ${latest}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            if (existing.some(i => i.title === title)) {
              core.info('Bump PR/issue already exists.');
              core.setOutput('skip', 'true');
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('pinned', pinned);
            core.setOutput('latest', latest);

      - name: Fetch Node release notes
        if: steps.detect.outputs.skip != 'true'
        run: |
          set -euo pipefail
          LATEST="${{ steps.detect.outputs.latest }}"
          if BODY=$(gh api "repos/nodejs/node/releases/tags/v${LATEST}" --jq .body 2>/dev/null); then
            # Prefer the Notable Changes section; fall back to a truncated full body
            printf '%s' "$BODY" | awk '
              /^### Notable Changes/ { on = 1; print; next }
              on && /^### /           { exit }
              on                      { print }
            ' > release-notes.md
            if [ ! -s release-notes.md ]; then
              printf '%s' "$BODY" | head -c 8000 > release-notes.md
            fi
            echo "Fetched release notes for v${LATEST}"
          else
            echo "(No GitHub release notes found for v${LATEST})" > release-notes.md
            echo "Warning: no release notes available for v${LATEST}" >&2
          fi

      - name: Apply version bump
        if: steps.detect.outputs.skip != 'true'
        env:
          PINNED: ${{ steps.detect.outputs.pinned }}
          LATEST: ${{ steps.detect.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="chore/node-bump-${LATEST}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          sed -i "s/ARG NODE_VERSION=${PINNED}/ARG NODE_VERSION=${LATEST}/" Dockerfile
          sed -i "s/node-version: '${PINNED}'/node-version: '${LATEST}'/g" .github/workflows/ci.yml
          for f in .agents/skills/docker-ci/SKILL.md .agents/skills/testing-cicd/SKILL.md .agents/skills/security-review/SKILL.md; do
            sed -i "s/${PINNED}/${LATEST}/g" "$f"
          done
          awk -v line="- **Node.js** bumped from \`${PINNED}\` to \`${LATEST}\` in Dockerfile and CI" '
            /^## \[Unreleased\]/ { unreleased = 1 }
            unreleased && /^### Changed/ && !done { print; print line; done = 1; next }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md
          git add Dockerfile .github/workflows/ci.yml .agents/skills CHANGELOG.md
          git commit -m "chore: update Node from ${PINNED} to ${LATEST}" -m "$(printf '%s\n' \
            "- bump NODE_VERSION to ${LATEST} in Dockerfile and all four ci.yml jobs" \
            "- update docker-ci, security-review, and testing-cicd skill docs to match" \
            "- add CHANGELOG entry under [Unreleased]")"
          git push --force origin "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_ENV"

      - name: Create bump PR
        if: steps.detect.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pinned = '${{ steps.detect.outputs.pinned }}';
            const latest = '${{ steps.detect.outputs.latest }}';
            const branch = process.env.branch || 'chore/node-bump-' + latest;
            const major = latest.split('.')[0];

            let notes = '';
            try { notes = fs.readFileSync('release-notes.md', 'utf8').trim(); } catch (e) {}

            const body = [
              `Automated Node.js bump from \`${pinned}\` to \`${latest}\` — the latest patch release in the v${major}.x track.`,
              '',
              '- bump `NODE_VERSION` to `' + latest + '` in Dockerfile and all four `ci.yml` jobs',
              '- update docker-ci, security-review, and testing-cicd skill docs to match',
              '- add CHANGELOG entry under `[Unreleased]`',
              '',
            ];
            if (notes) {
              body.push('### Node release notes', '', notes, '', '---');
            }
            body.push('_Auto-generated by the dependency version check workflow. Merge after CI passes._');

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: update Node from ${pinned} to ${latest}`,
              head: branch,
              base: context.repo.default_branch,
              body: body.join('\n'),
              assignees: ['sudocarlos'],
            });
            core.info(`Created PR #${pr.number}: ${pr.html_url}`);

            // GITHUB_TOKEN pushes do not trigger workflow runs; close + reopen
            // the PR to fire the pull_request (reopened) event and start CI.
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'open',
            });
            core.info('Reopened PR to trigger CI.');

  vite:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check Vite version and open issue if outdated
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            const fs = require('fs');

            function get(url) {
              return new Promise((resolve, reject) => {
                https.get(url, (res) => {
                  let data = '';
                  res.on('data', chunk => data += chunk);
                  res.on('end', () => resolve(data));
                }).on('error', reject);
              });
            }

            // 1. Read pinned version from webui/frontend/package.json
            const pkgPath = 'webui/frontend/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            const pinnedRaw = pkg.devDependencies?.vite;
            if (!pinnedRaw) { core.setFailed('Could not find vite in devDependencies'); return; }
            const pinned = pinnedRaw.replace(/^[~^]/, '');
            core.info(`Pinned Vite version: ${pinned}`);

            // 2. Fetch latest version from npm's latest dist-tag
            const npmData = await get('https://registry.npmjs.org/vite/latest');
            const latest = JSON.parse(npmData).version;
            if (!latest) { core.setFailed('Could not determine latest Vite version from npm'); return; }
            core.info(`Latest Vite version: ${latest}`);

            if (pinned === latest) { core.info('Vite is up to date.'); return; }

            // 3. Fetch the Vite changelog from GitHub and extract the relevant section
            const changelogUrl = 'https://raw.githubusercontent.com/vitejs/vite/main/packages/vite/CHANGELOG.md';
            let changelogSection = '';
            try {
              const changelog = await get(changelogUrl);
              // Find the version in brackets to handle varying heading formats
              // e.g. "## <small>[8.1.3](https://.../) (2026-07-02)</small>"
              const searchStr = `[${latest}]`;
              const idx = changelog.indexOf(searchStr);
              if (idx !== -1) {
                // Walk back to the ## heading start
                const before = changelog.substring(0, idx);
                const headingStart = before.lastIndexOf('## ');
                const lineStart = before.lastIndexOf('\n', headingStart) + 1;
                // Find the next ## heading
                const after = changelog.substring(lineStart + 1);
                const nextHeading = after.indexOf('\n## ');
                const end = nextHeading !== -1 ? lineStart + 1 + nextHeading : undefined;
                changelogSection = changelog.substring(lineStart, end).trim();
              }
            } catch (e) {
              core.warning(`Could not fetch changelog: ${e.message}`);
            }

            // 4. Build issue body
            const bodyLines = [
              `The \`webui/frontend/package.json\` pins Vite at \`${pinned}\` but the npm \`latest\` tag is \`${latest}\`.`,
              '',
              `| Field | Value |`,
              `|-------|-------|`,
              `| Pinned | \`${pinned}\` |`,
              `| Latest | \`${latest}\` |`,
              `| Source | \`webui/frontend/package.json\` |`,
              '',
            ];
            if (changelogSection) {
              bodyLines.push('### Changelog', '', changelogSection, '');
            }
            bodyLines.push(
              '### Links',
              `- [npm](https://www.npmjs.com/package/vite/v/${latest})`,
              `- [GitHub Releases](https://github.com/vitejs/vite/releases)`,
              `- [Changelog](https://github.com/vitejs/vite/blob/main/packages/vite/CHANGELOG.md)`,
            );

            // 5. Check for existing issue (open or closed)
            const title = `chore: update Vite from ${pinned} to ${latest}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            if (existing.some(i => i.title === title)) { core.info('Issue already exists.'); return; }

            // 6. Create the issue
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: bodyLines.join('\n'),
              assignees: ['sudocarlos'],
            });
            core.info(`Created issue #${issue.number}: ${issue.html_url}`);
